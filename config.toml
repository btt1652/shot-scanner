# scs - Default configuration
# Uses an Ollama decision model as the sole judge for classification.
# Multiple questions are defined in the [[questions]] array.

# feed prob score of last N request into the current request context
# prob >= 75 or confident >= 75

decision_model_sample_rate = 1
ollama_host = "192.168.1.190"
ollama_frame_scale = 0.1
ollama_decision_model = "clef-flash:9b"
ollama_timeout = 60
ollama_state_template = "frame from an adult video"
cache = "./.cache.db"
still_frame_threshold = 0.95
same_scene_threshold = 0.80
recursive = false
ollama_frame_history = 5
isolated_frame_time = 3

[[questions]]
name = "female_nudity"
instructions = "Classify only the female actress's nudity level based on clothing type, body coverage, and visible exposed body areas. Consider both how much of her body is covered and the type of clothing she is wearing. Use visual evidence only"
criteria = { "fully nude" = "The actress is completely naked and is not wearing clothing or underwear. Her body is entirely uncovered, although the entire body does not need to be visible in the frame if there is sufficient visual evidence to establish complete nudity", "partial nude" = "The actress is either wearing regular clothing that exposes intimate body parts or wearing minimal-coverage clothing that leaves most of her body exposed. This includes two cases: (1) Regular clothing that is opened, lowered, or adjusted to reveal breasts, nipples, buttocks, or genital areas, even if the rest of the outfit provides substantial coverage. (2) Minimal-coverage outfits such as bikinis, lingerie, bras, panties, or underwear, even when intimate body parts remain covered, if approximately 70% or more of the visible body surface is exposed skin. Use the overall amount of exposed skin and the type of clothing to make this classification. Do not count ordinary exposed areas such as the face, hands, or arms alone as sufficient coverage evidence", "no nudity" = "The actress is wearing regular everyday clothing, such as dresses, shirts, pants, skirts, or shorts. Clothing may expose ordinary body areas such as arms, legs, shoulders, cleavage, or stomach without qualifying as partial nudity" }

[[questions]]
name = "female_framing_direction"
instructions = "Classify the actress's body orientation relative to the camera based exclusively on the direction her torso is facing. Ignore the direction of her head, face, hips, and legs. Determine which side of her torso is most prominently visible to the camera"
criteria = { "front" = "The front of the actress's torso is facing the camera. Her chest and abdomen are primarily facing toward the camera", "side" = "The actress's torso is turned sideways relative to the camera. The side profile of her torso is primarily visible. This includes diagonal or three-quarter angles when the torso is positioned between a front-facing and back-facing orientation", "back" = "The back of the actress's torso is facing the camera. Her back is primarily visible, while her chest and abdomen are facing away from the camera" }

[[questions]]
name = "female_framing"
instructions = "Classify the camera framing based on which parts of the female actress's body are visible in the frame. Focus on the visible body area, not her pose or body orientation. Select the most specific matching category"
criteria = { "head and torso" = "head and torso\": \"The actress's head and upper body are visible, including her shoulders, chest, waist, or abdomen", "lower body" = "The frame primarily shows the actress's lower body, such as her buttocks, hips, thighs, or legs, while her head and upper torso are outside the frame or not significantly visible", "full body" = "The frame shows the actress's head, torso, and legs together. Her entire body does not need to be visible, but substantial portions of all three areas must be within the frame" }

[[questions]]
name = "sexual_activity"
instructions = "Classify the sexual activity visibly taking place in the frame. Focus on the action being performed, not the participants' body positions. Use only visible evidence and do not infer activity from poses or facial expressions alone"
criteria = { "kissing" = "The actress is visibly kissing another person on the lips or tongue", "makeout" = "The actress is touching or being touched on intimate body areas or cuddle each other in a sexual context", "blowjob" = "The actress is visibly performing or receiving oral sexual activity, including a blowjob", "penetrative_sex" = "The actress is visibly engaging in vaginal or anal penetrative sexual activity", "masturbation" = "The actress is visibly stimulating her own genitals for sexual purposes" }

[[questions]]
name = "sex_position"
instructions = "Classify the physical arrangement of the actress and her partner based on their visible body positions and relative orientation. Focus on who is above or below, whether they are standing, sitting, or lying down, and whether they face each other or face away. Ignore the specific sexual activity being performed. Select the closest matching position"
criteria = { "missionary" = "The actress is lying on her back while her partner is positioned above her, facing her", "cowgirl" = "The actress is positioned above her partner, facing toward her partner", "reverse_cowgirl" = "The actress is positioned above her partner, facing away from her partner", "doggy_style" = "The actress is positioned on her hands and knees or leaning forward, with her partner positioned behind her", "standing" = "Both participants are standing during the interaction", "side_by_side" = "Both participants are lying beside each other, either facing the same direction or facing one another", "sitting" = "One or both participants are seated, with their bodies arranged in a seated position", "other_position" = "The participants' physical arrangement is visible but does not match any of the defined positions" }

[[questions]]
name = "female_count"
instructions = "How many female actress in the frame?"
criteria = { "one" = "", "more than one" = "" }

[[questions]]
name = "female_pose"
instructions = "Classify the female actress's physical body position in the frame. Focus on her overall posture, including whether she is standing, sitting, kneeling, crouching, or lying down. For lying positions, distinguish between lying on her front, back, or side. Base the classification on her torso, hips, and legs rather than the direction of her face. Do not infer a position when the relevant body parts are not visible"
criteria = { "standing" = "The actress is upright on her feet, with her body supported primarily by her legs", "sitting" = "The actress is sitting on a chair, bed, floor, or another surface, with her weight supported primarily by her buttocks", "lying_on_back" = "The actress is lying horizontally with her back against a supporting surface and her chest facing upward", "lying_on_stomach" = "The actress is lying horizontally on her stomach, with her front torso facing downward", "lying_on_side" = "The actress is lying horizontally on her left or right side", "on_all_fours" = "The actress is supporting her body with both hands and both knees, with her torso generally horizontal", "kneeling" = "The actress is supporting her body on one or both knees, whether upright or leaning forward" }
