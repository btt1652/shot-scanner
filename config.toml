criteria = { "bedroom" = "Bedroom (bed, nightstands, residential)", "living_room" = "Living room / sofa / couch setting", "kitchen" = "Kitchen / dining area", "bathroom" = "Bathroom / shower / tub", "outdoor" = "Outdoor (yard, beach, pool, public, nature)", "hotel" = "Hotel / motel room", "office" = "Office / workplace setting", "dungeon" = "Dungeon / BDSM room / play space", "vehicle" = "Car / van / vehicle interior", "studio" = "Professional studio (backdrop, lighting rig visible)", "other_indoor" = "Other indoor location" }

