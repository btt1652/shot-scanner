criteria = { "missionary" = "Missionary position (man on top, face-to-face)", "doggy_style" = "Doggy style / rear entry", "cowgirl" = "Cowgirl / woman on top facing man", "reverse_cowgirl" = "Reverse cowgirl / woman on top facing away", "spooning" = "Spooning / side-by-side rear entry", "standing" = "Standing position", "sixty_nine" = "69 / mutual oral", "blowjob" = "Fellatio / blowjob (primary focus)", "cunnilingus" = "Cunnilingus / oral on female", "handjob" = "Handjob / manual stimulation", "fingering" = "Fingering / manual stimulation of female", "anal" = "Anal penetration", "double_penetration" = "Double penetration (DP)", "tribbing" = "Tribbing / scissoring", "other" = "Other position not listed", "none" = "No sexual position visible" }

