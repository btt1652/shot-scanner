# vsearch - Default configuration
# Decision-model-only search mode: uses an Ollama decision model as the sole judge

[search]
top_k = -1
json_output = false
save_frames = ""
decision_model_floor = 0.8
decision_model_sample_rate = 3
ollama_host = "192.168.1.190" 
ollama_frame_scale = 0.1
ollama_decision_model = "clef-flash:9b" #"d3:4b" d1:3b
ollama_timeout = 60
cache_dir = "/tmp"
save_cache_dir = "/tmp"
still_frame_threshold = 0.95
same_scene_threshold = 0.80
max_scene_batch_size = 4
merge_range = false
stitch = ""
ollama_state_template = "sample frame from a video"
ollama_instructions_template = ""
